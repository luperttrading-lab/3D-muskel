# Netlify: verbindet das Repository, baut mit Vite und liefert dist/ über HTTPS aus.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# index.html und Service Worker nie aus dem HTTP-Cache – sonst erreicht ein Update das iPhone nicht
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Gebaute Dateien tragen einen Inhalts-Hash im Namen
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/modelle/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
